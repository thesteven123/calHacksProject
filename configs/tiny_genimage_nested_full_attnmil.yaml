# Item 4 ablation (pre-registered: runs/helper/TASK_midjourney_ablation.md): identical to
# configs/tiny_genimage_nested_full.yaml except model.patch_pool = attn_mil (gated attention-MIL over each feature
# layer's patch tokens instead of their mean; zero-initialised scorer, so training starts at the mean pool).
# Full Tiny-GenImage (28k train / 7k val; CC-BY-NC-SA-4.0, research only), nested LOGO, conformal calibration.
# Used by scripts/modal_logo.py --base-config configs/tiny_genimage_nested_full.yaml (selection/holdout overridden
# per rotation). ~4x more test reals per rotation than the 2-shard subset -> much tighter TPR@1%FPR estimates.
model:
  backbone: facebook/dinov2-base
  feature_layers: [4, 8, 10, 12]
  lora_rank: 8
  lora_blocks: 3
  patch_pool: attn_mil
data:
  source: hf
  hf_dataset: TheKernel01/Tiny-GenImage
  hf_train_split: train
  hf_val_split: validation
  generator_column: generator
  selection_generators: [GLIDE]
  holdout_generators: [Midjourney]
  num_workers: 4
train:
  epochs: 2
  batch_size: 32
  log_every: 50
  calibration_method: conformal
  output_dir: runs/tiny_genimage_nested_full_attnmil
