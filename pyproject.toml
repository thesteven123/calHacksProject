[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfd"
version = "0.1.0"
description = "Social-media-robust deepfake detection (DINOv2 + LoRA + VIB, tiered funnel)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "timm>=1.0.9",
    "datasets>=3.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
video = ["av>=12.0"]
faces = ["mediapipe>=0.10"]
tinker = ["tinker-cookbook"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
tracking = ["wandb>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
